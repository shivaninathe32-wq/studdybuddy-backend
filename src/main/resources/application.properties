spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studyflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8080}
app.jwt.secret=${JWT_SECRET:StudyFlowSecretKeyForJWTTokenGenerationMustBeLongEnough256Bits!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.reset-token.expiration-ms=${RESET_TOKEN_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
